<!DOCTYPE html>
<!-- Informa ao navegador que o documento usa HTML5. -->
<!-- Define o idioma do conteúdo para navegação acessível e correta interpretação do texto. -->
<html lang="pt-BR">
  <head>
    <!-- Permite a exibição correta de caracteres especiais e acentuados. -->
    <meta charset="UTF-8" />
    <!-- Faz o layout ocupar a largura e escala adequadas em celulares e tablets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Define o título da tela de login na aba do navegador. -->
    <title>Trilha | Login</title>
    <!-- Carrega a identidade visual compartilhada do cabeçalho. -->
    <link rel="stylesheet" href="site-header.css" />
    <!-- Carrega o estilo compartilhado pelas telas de autenticação. -->
    <link rel="stylesheet" href="auth.css" />
    <!-- Disponibiliza funções comuns de autenticação e alternância de senha. -->
    <script type="module" src="auth.js"></script>
    <!-- Carrega a lógica específica do formulário de login. -->
    <script type="module" src="login.js"></script>
  </head>
  <!-- Aplica a estrutura visual das telas de autenticação. -->
  <body class="auth-page">
    <!-- Cabeçalho comum com a marca e os links de navegação desta tela. -->
    <header class="site-header">
      <div class="site-header-inner">
        <a class="site-brand" href="index.html" aria-label="Trilha - página inicial">
          <span class="site-brand-mark" aria-hidden="true">K</span>
          <span>Trilha</span>
        </a>
        <nav class="site-header-actions" aria-label="Navegação principal">
          <a class="site-header-link" href="index.html">Início</a>
          <a class="site-header-link site-header-link-primary" href="cadastro.html">Criar conta</a>
        </nav>
      </div>
    </header>
    <!-- Divide a tela entre apresentação do produto e formulário. -->
    <div class="auth-shell">
      <!-- Painel ilustrativo que apresenta o produto ao usuário. -->
      <aside class="auth-visual">
        <h1>Bem-vindo de volta</h1>
        <p>Organize tarefas, acompanhe prioridades e mantenha seu fluxo em movimento.</p>

        <!-- Exemplo visual reduzido de cartões e etapas do Kanban. -->
        <div class="mini-board" aria-label="Preview do quadro Kanban">
          <div class="mini-column">
            <span>Hoje</span>
            <div class="mini-card blue">Revisar briefing</div>
          </div>
          <div class="mini-column">
            <span>Andamento</span>
            <div class="mini-card purple">Implementar tela</div>
          </div>
        </div>
      </aside>

      <!-- Área principal com os campos usados para entrar na conta. -->
      <main class="auth-card">
        <!-- Formulário processado pelo login.js sem recarregar a página. -->
        <form id="loginForm" novalidate>
          <!-- Identifica a finalidade do formulário. -->
          <div class="auth-header">
            <span class="eyebrow">Acesse sua conta</span>
            <h2>Entrar</h2>
          </div>

          <!-- Rótulo e campo para informar o e-mail associado à conta. -->
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" placeholder="seu@email.com" required />

          <!-- Rótulo e campo para informar a senha da conta. -->
          <label for="password">Senha</label>
          <!-- Agrupa o campo de senha e o botão que alterna sua visibilidade. -->
          <div class="password-field">
            <input id="password" name="password" type="password" placeholder="Digite sua senha" required />
            <button type="button" class="toggle-password" data-password-toggle="password" aria-label="Mostrar senha">
              Mostrar
            </button>
          </div>

          <!-- Envia os dados do formulário para validação pelo JavaScript. -->
          <button type="submit" class="btn btn-primary btn-block">Entrar</button>

          <!-- Região acessível onde o JavaScript mostra erros ou sucesso. -->
          <p class="form-message" id="formMessage" aria-live="polite"></p>

          <!-- Link para quem ainda precisa criar uma conta. -->
          <p class="auth-link">
            Ainda não tem conta?
            <a href="cadastro.html">Cadastre-se</a>
          </p>
        </form>
      </main>
    </div>
  </body>
</html>
